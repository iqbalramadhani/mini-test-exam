# LiteSpeed native rewrite rules — no .htaccess override needed
RewriteEngine on

# If request is for a real file or directory, serve it directly
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

# Pass API routes to index.php (with QSA to preserve query string)
RewriteCond %{REQUEST_URI} ^/?api/
RewriteRule ^(.*)$ index.php?url=$1 [QSA,L]

# Serve React SPA for all other non-file/non-dir requests
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ react-app/index.html [L]
