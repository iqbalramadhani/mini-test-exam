name: CI/CD Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: PHP syntax check
        run: |
          find application public -name "*.php" -not -path "public/react-app/*" -print0 | xargs -0 -n1 php -l

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP unit tests
        run: composer test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Lint React app
        working-directory: react-app
        run: npm run lint

      - name: Run React tests
        working-directory: react-app
        run: npm run test

      - name: Build React app
        working-directory: react-app
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          mkdir -p bundle
          rsync -a --delete \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='./react-app/' \
            --exclude='/react-app/' \
            --exclude='.DS_Store' \
            --exclude='docs/' \
            --exclude='_install/' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.result.cache' \
            ./ bundle/
          find bundle -type f | wc -l

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: bundle/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: bundle/

      - name: List files to deploy
        run: find bundle -type f | head -50

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: bundle/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          protocol: ftps
          port: 21
          exclude: |
            **/.DS_Store
            **/*.db

      - name: Run database migrations via API
        env:
          MIGRATION_SECRET: ${{ secrets.MIGRATION_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Triggering migrations on ${APP_URL}/api/migration/run ..."
          response=$(curl -s -w "\n%{http_code}" -X POST "${APP_URL}/api/migration/run" \
            -H "Content-Type: application/json" \
            -H "X-Migration-Secret: ${MIGRATION_SECRET}")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP ${http_code}"
          echo "Response: ${body}"
          if [ "$http_code" != "200" ]; then
            echo "::error::Migration failed with HTTP ${http_code}"
            exit 1
          fi
